<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thực đơn</title>
    <link rel="stylesheet" href="Styles/style.css">
</head>
<body>
    <form onsubmit="return false;">
        <table id="thucdon">
            <tr>
                <td colspan="3" class="tieude">THỰC ĐƠN</td>
            </tr>
            <tr class="nhan">
                <td>Thức ăn</td>
                <td>Nước uống</td>
                <td>Thời điểm</td>
            </tr>
            <tr>
                <td>
                    <select id="thucan" multiple size="7">
                        <option value="20000">Bún bò</option>
                        <option value="18000">Hủ tiếu</option>
                        <option value="17000">Bánh canh</option>
                        <option value="19000">Phở bò</option>
                        <option value="15000">Nuôi</option>
                        <option value="12000">Bánh mì thịt</option>
                        <option value="15000">Bánh cuốn</option>
                    </select>
                </td>
                <td>
                    <select id="nuocuong" multiple size="7">
                        <option value="12000">Cà phê đá</option>
                        <option value="15000">Cà phê sữa đá</option>
                        <option value="13000">Chanh dây</option>
                        <option value="12000">Chanh muối</option>
                        <option value="14000">Xí muội</option>
                        <option value="13000">Sữa tươi</option>
                        <option value="17000">Cam vắt</option>
                    </select>
                </td>
                <td class="thoidiem">
                    <label><input type="radio" name="thoidiem" id="ngay" checked> Ban ngày</label><br><br>
                    <label><input type="radio" name="thoidiem" id="dem"> Ban đêm</label>
                </td>
            </tr>
            <tr>
                <td colspan="3" class="giua"><input type="button" value="Tính tiền" onclick="tinhTien()"></td>
            </tr>
            <tr>
                <td colspan="3" id="ketqua"></td>
            </tr>
        </table>
    </form>
    <script src="Scripts/demo.js"></script>
</body>
</html>
